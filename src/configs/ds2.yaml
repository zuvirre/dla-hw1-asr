defaults:
  - model: deepspeech2
  - writer: cometml
  - metrics: ds2
  - datasets: ds2
  - dataloader: ds2
  - transforms: ds2
  - _self_
optimizer:
  _target_: torch.optim.AdamW
  lr: 1e-3 # overwritten by OneCycleLR schedule
lr_scheduler:
  _target_: torch.optim.lr_scheduler.OneCycleLR
  max_lr: 1e-3
  pct_start: 0.1
  steps_per_epoch: ${trainer.epoch_len}
  epochs: ${trainer.n_epochs}
  anneal_strategy: cos
loss_function:
  _target_: src.loss.CTCLossWrapper
  zero_infinity: True
text_encoder:
  _target_: src.text_encoder.CTCTextEncoder
trainer:
  log_step: 50
  n_epochs: 40
  epoch_len: 500
  device_tensors: ["spectrogram", "text_encoded"]
  resume_from: null
  device: auto
  override: False
  monitor: "min val_WER_(Argmax)"
  save_period: 1
  keep_last: 4
  early_stop: ${trainer.n_epochs}
  save_dir: "saved"
  seed: 1
  max_grad_norm: 10
