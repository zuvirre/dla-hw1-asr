defaults:
  - model: deepspeech2
  - metrics: ds2_beam
  - datasets: ds2_test # we do not want to run inference on training data
  - dataloader: ds2
  - transforms: ds2
  - _self_
text_encoder:
  _target_: src.text_encoder.CTCTextEncoder
inferencer:
  device_tensors: ["spectrogram"] # which tensors should be on device (ex. GPU)
  device: auto # device name or "auto"
  save_path: "ds2_final2_960h"
  seed: 1
  from_pretrained: "saved/ds2_final2_960h/model_best.pth" # path to the pretrained model
