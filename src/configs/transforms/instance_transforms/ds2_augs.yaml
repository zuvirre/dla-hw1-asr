train:
  get_spectrogram: # special key for getting spectrogram
    _target_: torchvision.transforms.v2.Compose
    transforms:
      - _target_: torchaudio.transforms.MelSpectrogram
        sample_rate: 16000
        n_mels: 128
      - _target_: torchaudio.transforms.AmplitudeToDB # log
        stype: power
        top_db: 80
  audio: # name of the tensor on which we apply transform
    _target_: torchvision.transforms.v2.Compose
    transforms:
      - _target_: src.transforms.wav_augs.RandomSpeed
        sample_rate: 16000
        factors: [0.9, 1.0, 1.1]
      - _target_: src.transforms.wav_augs.TorchAudiomentation
        aug:
          _target_: torch_audiomentations.LowPassFilter
          min_cutoff_freq: 3400
          max_cutoff_freq: 7500
          p: 0.2
          sample_rate: 16000
          output_type: tensor
      - _target_: src.transforms.wav_augs.Gain
        output_type: tensor
      - _target_: src.transforms.wav_augs.TorchAudiomentation
        aug:
          _target_: torch_audiomentations.AddColoredNoise
          min_snr_in_db: 10
          max_snr_in_db: 30
          p: 0.3
          sample_rate: 16000
          output_type: tensor
  spectrogram:
    _target_: src.transforms.spec_augs.SpecAugment
    freq_mask_param: 27
    time_mask_param: 60
    n_freq_masks: 2
    n_time_masks: 2
    max_time_ratio: 0.1

inference:
  get_spectrogram:
    _target_: torchvision.transforms.v2.Compose
    transforms:
      - _target_: torchaudio.transforms.MelSpectrogram
        sample_rate: 16000
        n_mels: 128
      - _target_: torchaudio.transforms.AmplitudeToDB
        stype: power
        top_db: 80
