hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=MULTIRUN
    task:
    - datasets.test_clean.part=dev-other
    - +datasets.test_clean.limit=500
    - ~datasets.test_other
    - text_encoder.alpha=0.3,0.5,0.7,1
    - text_encoder.beta=0.0,0.5,1,1.5
  job:
    name: inference
    chdir: null
    override_dirname: +datasets.test_clean.limit=500,datasets.test_clean.part=dev-other,text_encoder.alpha=0.3,0.5,0.7,1,text_encoder.beta=0.0,0.5,1,1.5,~datasets.test_other
    id: ???
    num: ???
    config_name: inference
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.7
    version_base: '1.3'
    cwd: C:\Users\Oleg\VSCodeProjects\DLA\dla-hw1-asr
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: C:\Users\Oleg\VSCodeProjects\DLA\dla-hw1-asr\src\configs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: ???
    choices:
      transforms: ds2
      transforms/instance_transforms: ds2
      dataloader: ds2
      datasets: ds2_test
      metrics: ds2_beam
      model: deepspeech2
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
model:
  _target_: src.model.DeepSpeech2
  n_feats: 128
  conv_params:
  - kernel:
    - 41
    - 11
    stride:
    - 2
    - 2
    padding:
    - 20
    - 5
  - kernel:
    - 21
    - 11
    stride:
    - 2
    - 1
    padding:
    - 10
    - 5
  conv_channels: 32
  rnn_hidden: 512
  rnn_layers: 3
  dropout: 0.1
metrics:
  inference:
  - _target_: src.metrics.ArgmaxCERMetric
    name: CER_(Argmax)
  - _target_: src.metrics.ArgmaxWERMetric
    name: WER_(Argmax)
  - _target_: src.metrics.BeamSearchCERMetric
    name: CER_(BeamSearch)
    beam_size: 10
  - _target_: src.metrics.BeamSearchWERMetric
    name: WER_(BeamSearch)
    beam_size: 10
  - _target_: src.metrics.BeamSearchCERMetric
    name: CER_(BeamSearch+LM)
    beam_size: 10
    use_lm: true
  - _target_: src.metrics.BeamSearchWERMetric
    name: WER_(BeamSearch+LM)
    beam_size: 10
    use_lm: true
datasets:
  test_clean:
    _target_: src.datasets.LibrispeechDataset
    part: dev-other
    instance_transforms: ${transforms.instance_transforms.inference}
    limit: 500
dataloader:
  _target_: torch.utils.data.DataLoader
  batch_size: 32
  num_workers: 4
  pin_memory: true
  persistent_workers: true
transforms:
  instance_transforms:
    train:
      get_spectrogram:
        _target_: torchvision.transforms.v2.Compose
        transforms:
        - _target_: torchaudio.transforms.MelSpectrogram
          sample_rate: 16000
          n_mels: 128
        - _target_: torchaudio.transforms.AmplitudeToDB
          stype: power
          top_db: 80
      audio:
        _target_: torchvision.transforms.v2.Compose
        transforms:
        - _target_: src.transforms.wav_augs.Gain
    inference:
      get_spectrogram:
        _target_: torchvision.transforms.v2.Compose
        transforms:
        - _target_: torchaudio.transforms.MelSpectrogram
          sample_rate: 16000
          n_mels: 128
        - _target_: torchaudio.transforms.AmplitudeToDB
          stype: power
          top_db: 80
  batch_transforms:
    train: null
    inference: null
text_encoder:
  _target_: src.text_encoder.CTCTextEncoder
  lm_path: data/lm/3-gram.pruned.1e-7.lower.arpa
  alpha: 0.5
  beta: 1.0
inferencer:
  device_tensors:
  - spectrogram
  device: auto
  save_path: ds2_final2_960h
  seed: 1
  from_pretrained: saved/ds2_final2_960h/model_best.pth
